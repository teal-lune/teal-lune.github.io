<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Form</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body class="bg-light d-flex flex-column min-vh-100">
        <header class="sticky-top">
            <nav class="navbar bg-danger">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        <h1 class="text-light">Sign Up</h1>
                    </a>
                </div>
            </nav>
        </header>
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card">
                            <div class="card-header">
                                <span class="text-secondary">Sign Up Form</span>
                            </div>
                            <div class="card-body">
                                <form id="signupForm" action="welcome.html">
                                    <fieldset>
                                        <legend class="text-danger">Introduce Yourself</legend>
                                        <div class="mb-3">
                                            <label for="fName" class="form-label text-secondary">First Name:</label>
                                            <input type="text" id="fName" name="fName" class="form-control">
                                            <div id="q6Feedback"></div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="lName" class="form-label text-secondary">Last Name:</label>
                                            <input type="text" id="lName" name="lName" class="form-control">
                                        </div>
                                        <div class="mb-3">
                                            <p class="form-label text-secondary">Gender:</p>
                                            <label class="form-label text-secondary"><input type="radio" name="gender" value="m" class="form-check-input"> Male</label>
                                            <label class="form-label text-secondary"><input type="radio" name="gender" value="f" class="form-check-input"> Female</label>
                                        </div>
                                    </fieldset>
                                    <fieldset>
                                        <legend class="text-danger">Where Are You From?</legend>
                                        <div class="mb-3">
                                            <label for="zip" class="form-label text-secondary">Zip Code:</label>
                                            <input type="text" id="zip" name="zip" class="form-control">
                                        </div>
                                        <div class="mb-3 text-secondary">
                                            City: <span id="city"></span>
                                        </div>
                                        <div class="mb-3 text-secondary">
                                            Latitude: <span id="latitude"></span>
                                        </div>
                                        <div class="mb-3 text-secondary">
                                            Longitude: <span id="longitude"></span>
                                        </div>
                                        <div class="mb-3">
                                            <label for="state" class="form-label text-secondary">State:</label>
                                            <select id="state" name="state" class="form-control">
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="county" class="form-label text-secondary">County:</label>
                                            <select id="county" name="county" class="form-control">
                                            </select>
                                        </div>
                                    </fieldset>
                                    <fieldset>
                                        <legend class="text-danger">Your New Account Info</legend>
                                        <div class="mb-3">
                                            <label for="username" class="form-label text-secondary">Desired Username:</label>
                                            <input type="text" id="username" name="username" class="form-control">
                                            <span id="usernameError"></span>
                                        </div>
                                        <div class="mb-3">
                                            <label for="password" class="form-label text-secondary">Password:</label>
                                            <input type="password" id="password" name="password" class="form-control">
                                            <div id="passErr"></div>
                                            <span id="suggested" class="form-label text-secondary"></span>
                                        </div>
                                        <div class="mb-3">
                                            <label for="passwordAgain" class="form-label text-secondary">Re-enter Password:</label>
                                            <input type="password" id="passwordAgain" name="passwordAgain" class="form-control">
                                            <span id="passwordError"></span>
                                        </div>
                                    </fieldset>
                                    <button class="btn btn-danger">Sign Up</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="bg-secondary text-light text-center py-3 mt-auto">
            <div class="container d-flex flex-wrap justify-content-center align-items-center gap-3 text-center">
                <img src="img/logo.jpg" alt="CSUMB Logo" class="img-fluid" id="logo">
                <div class="small">
                    <p class="mb-1">&copy; Olga Bradford. All rights reserved.</p>
                    <p class="mb-1">This site is for academic purposes only.</p>
                    <p class="mb-0">CST 336 Internet Programming.</p>
                </div>
            </div>
        </footer>
        <script src="js/script.js"></script>
    </body>
</html>
