<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-light bg-light" id="navig-top">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="#">FakeMart</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Fake Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Fake About</a></li>
                </ul>
                <button class="btn btn-outline-dark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket3-fill" viewBox="0 0 16 16">
                        <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H.5a.5.5 0 0 1-.5-.5v-1A.5.5 0 0 1 .5 6h1.717L5.07 1.243a.5.5 0 0 1 .686-.172zM2.468 15.426.943 9h14.114l-1.525 6.426a.75.75 0 0 1-.729.574H3.197a.75.75 0 0 1-.73-.574z"/>
                    </svg>
                    <span>Fake Cart</span>
                </button>
            </div>
        </div>
    </nav>
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <img src="img/fakemart-montserrat.svg" alt="FakeMart logo" id="fake-mart">
                <p class="lead fw-normal text-white-50 mb-0">FakeMart, Fake Products, Fake Everything!</p>
            </div>
        </div>
    </header>
    <main>
        <nav class="navbar navbar-expand-lg navbar-light bg-light" id="navig-bottom">
            <div class="container px-4 px-lg-5">
                <div>
                    <form id="search">
                        <label for="minPrice" class="form-label text-secondary">Fake Price Min.: <input type="number" step="0.01" id="minPrice" name="minPrice" class="form-control"></label>
                        <label for="maxPrice" class="form-label text-secondary">Fake Price Max.: <input type="number" step="0.01" id="maxPrice" name="maxPrice" class="form-control"></label>
                        <button class="btn btn-outline-dark" id="srchBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            Search
                        </button>
                        <span id="validationErr"></span>
                    </form>
                </div>
            </div>
        </nav>
        <div id="loader" class="text-center my-4 d-none">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="product-container">
        </div>
    </main>
    <footer class="bg-secondary text-light text-center py-3 mt-auto">
        <div class="container d-flex flex-wrap justify-content-center align-items-center gap-3 text-center">
            <img src="img/logo.jpg" alt="CSUMB Logo" class="img-fluid" id="logo">
            <div class="small">
                <p class="mb-1">&copy; Olga Bradford. All rights reserved.</p>
                <p class="mb-1">This site is for academic purposes only.</p>
                <p class="mb-0">CST 336 Internet Programming.</p>
            </div>
        </div>
    </footer>
<script src="js/script.js"></script>
</body>
</html>
