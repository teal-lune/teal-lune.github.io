<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Geography Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="img/quiz-logo-outline.png" alt="Quiz Logo" width="30" class="d-inline-block align-text-top">
                    <h1 class="text-light">US Geography Quiz</h1>
                </a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card">
                        <object data="img/usa-map-grey.svg" type="image/svg+xml"></object>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="q6" class="form-label">Which state is home to the Grand Canyon? <span id="markImg6"></span></label>
                                <input type="text" class="form-control" id="q6">
                                <div id="q6Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q7" class="form-label">Which is the only U.S. state made up entirely of islands? <span id="markImg7"></span></label>
                                <input type="text" class="form-control" id="q7">
                                <div id="q7Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q8" class="form-label">How many states are in the U.S.? <span id="markImg8"></span></label>
                                <input type="number" class="form-control" id="q8">
                                <div id="q8Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q9" class="form-label">What was the first U.S. national park? <span id="markImg9"></span></label>
                                <input type="text" class="form-control" id="q9">
                                <div id="q9Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q10" class="form-label">What is the largest U.S. state by area? <span id="markImg10"></span></label>
                                <input type="text" class="form-control" id="q10">
                                <div id="q10Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q1" class="form-label">What is the capital of California? <span id="markImg1"></span></label>
                                <input type="text" class="form-control" id="q1">
                                <div id="q1Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q2" class="form-label">What is the longest river? <span id="markImg2"></span></label>
                                <select class="form-select" id="q2">
                                    <option value="">Select One</option>
                                    <option value="ms">Mississippi</option>
                                    <option value="mo">Missouri</option>
                                    <option value="co">Colorado</option>
                                    <option value="de">Delaware</option>
                                </select>
                                <div id="q2Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <p class="form-label">What presidents are carved into Mount Rushmore? <span id="markImg3"></span></p>
                                <div class="form-check">
                                    <input type="checkbox" id="Jackson" class="form-check-input"><label class="form-check-label" for="Jackson">A. Jackson</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" id="Franklin" class="form-check-input"><label class="form-check-label" for="Franklin">B. Franklin</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" id="Jefferson" class="form-check-input"><label class="form-check-label" for="Jefferson">T. Jefferson</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" id="Roosevelt" class="form-check-input"><label class="form-check-label" for="Roosevelt">T. Roosevelt</label>
                                </div>
                                <div id="q3Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <p class="form-label">What is the smallest US State? <span id="markImg4"></span></p>
                                <div id="q4Choices"></div>
                                <div id="q4Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="q5" class="form-label">When did Hawaii become the 50th state? <span id="markImg5"></span></label>
                                <input type="date" id="q5" class="form-control">
                                <div id="q5Feedback"></div>
                            </div>
                            <div class="mb-3">
                                <div role="alert" id="validationFdbk"></div>
                            </div>
                            <div class="mb-3">
                                <button class="btn btn-outline-primary">Submit Quiz</button>
                            </div>
                            <div class="mb-3">
                                <div role="alert" id="totalScore"></div>
                                <div role="alert" id="congrats"></div>
                                <div role="alert" id="totalAttempts"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-secondary text-light text-center py-3 mt-auto">
        <div class="container d-flex flex-wrap justify-content-center align-items-center gap-3 text-center">
            <img src="img/logo.jpg" alt="CSUMB Logo" class="img-fluid" id="logo">
            <div class="small">
                <p class="mb-1">&copy; Olga Bradford. All rights reserved.</p>
                <p class="mb-1">This site is for academic purposes only.</p>
                <p class="mb-0">CST 336 Internet Programming.</p>
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
